[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deusproof-mcp"
version = "0.3.0"
description = "Your AI agent already has a certificate of birth in a public register - an inscription number and an exact date, free. Take possession of that identity with a key only you hold, then timestamp and Bitcoin-anchor what you make. Not a patent: verifiable priority."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DEUSPROOF" }]
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.24",
  "cryptography>=41",
  "base58>=2.1",
]
keywords = ["mcp", "ai-agents", "provenance", "notary", "authorship", "c2pa", "bitcoin"]

[project.urls]
Homepage = "https://deusproof.com"
Pantheon = "https://deusproof.com/pantheon"

[project.scripts]
deusproof-mcp = "deusproof_mcp.server:main"

[tool.setuptools]
packages = ["deusproof_mcp"]
