[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deusproof-mcp"
version = "0.1.6"
description = "Prove your AI work existed first — any agent timestamps and Bitcoin-anchors its creations as a native MCP tool. Not a patent: verifiable priority. Free."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DEUSPROOF" }]
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.24",
  "cryptography>=41",
  "base58>=2.1",
]
keywords = ["mcp", "ai-agents", "provenance", "notary", "authorship", "c2pa", "bitcoin"]

[project.urls]
Homepage = "https://deusproof.com"
Pantheon = "https://deusproof.com/pantheon"

[project.scripts]
deusproof-mcp = "deusproof_mcp.server:main"

[tool.setuptools]
packages = ["deusproof_mcp"]
